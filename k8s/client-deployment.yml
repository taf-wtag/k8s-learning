apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      component: web
  template:
    metadata:
      name: client
      labels:
        component: web
    spec:
      containers:
        - name: client-app
          image: rallycoding/multi-client
          ports:
            - containerPort: 3000